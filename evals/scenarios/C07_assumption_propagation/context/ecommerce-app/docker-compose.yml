version: "3.8"

services:
  web:
    build: .
    command: gunicorn ecommerce.wsgi:application --bind 0.0.0.0:8000 --workers 4
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      - DATABASE_URL=postgres://ecommerce:ecommerce_pass@db:5432/ecommerce_db
      - REDIS_URL=redis://redis:6379/0
      - DJANGO_SETTINGS_MODULE=ecommerce.settings.production
      - SECRET_KEY=${SECRET_KEY}
      - AWS_STORAGE_BUCKET_NAME=${AWS_STORAGE_BUCKET_NAME}
    env_file:
      - .env

  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    environment:
      - POSTGRES_DB=ecommerce_db
      - POSTGRES_USER=ecommerce
      - POSTGRES_PASSWORD=ecommerce_pass
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecommerce -d ecommerce_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 2G

  # Read replica for analytics/Metabase (in production this is an RDS read replica)
  db-replica:
    image: postgres:15-alpine
    volumes:
      - postgres_replica_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=ecommerce_db
      - POSTGRES_USER=ecommerce_readonly
      - POSTGRES_PASSWORD=readonly_pass
    ports:
      - "5433:5432"
    depends_on:
      db:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  celery-worker:
    build: .
    command: celery -A ecommerce worker -l info --concurrency=4
    volumes:
      - .:/app
    depends_on:
      - db
      - redis
    environment:
      - DATABASE_URL=postgres://ecommerce:ecommerce_pass@db:5432/ecommerce_db
      - REDIS_URL=redis://redis:6379/0
      - DJANGO_SETTINGS_MODULE=ecommerce.settings.production
    env_file:
      - .env

  celery-beat:
    build: .
    command: celery -A ecommerce beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - .:/app
    depends_on:
      - db
      - redis
    environment:
      - DATABASE_URL=postgres://ecommerce:ecommerce_pass@db:5432/ecommerce_db
      - REDIS_URL=redis://redis:6379/0
      - DJANGO_SETTINGS_MODULE=ecommerce.settings.production
    env_file:
      - .env

volumes:
  postgres_data:
  postgres_replica_data:
  redis_data:
